[package]
authors = ["Simon Johnston <johnstonskj@gmail.com>"]
name = "zsh-plugin-cli"
version = "0.2.1"
description = "A command-line tool to generate new Zsh plugins."
documentation = "https://docs.rs/zsh-plugin-cli/"
repository = "https://github.com/johnstonskj/rust-zsh-plugin-cli.git"
license = "MIT/Apache-2.0"
readme = "README.md"
edition = "2024"
publish = true

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "cargo", "wrap_help"] }
clap-verbosity-flag = { version = "3.0", default-features = false, features = [
    "tracing",
] }
clap_complete = "4.5"
tera = "1.20"
flat_error = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter"] }
git2 = "0.20.3"


[[bin]]
name = "zsh-plugin"
path = "src/main.rs"

[workspace.lints.rust]
exported_private_dependencies = "deny"
anonymous_parameters = "deny"
bare_trait_objects = "deny"
deref_nullptr = "deny"
drop_bounds = "deny"
dyn_drop = "deny"
ellipsis_inclusive_range_patterns = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

absolute_paths_not_starting_with_crate = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
future_incompatible = { level = "warn", priority = -1 }
macro_use_extern_crate = "warn"
missing_debug_implementations = "warn"
nonstandard_style = { level = "warn", priority = -1 }
noop_method_call = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2021_prelude_collisions = "warn"
semicolon_in_expressions_from_macros = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unexpected_cfgs = "warn"
unreachable_pub = "warn"
unused = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = "warn"
